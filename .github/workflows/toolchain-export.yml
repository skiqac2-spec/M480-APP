name: Export cegcc toolchain (temporary)

on:
  push:
    paths:
      - '.github/workflows/toolchain-export.yml'

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - name: Cache cegcc toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /opt/cegcc
          key: cegcc-arm-mingw32ce-v1
      - name: Pack
        if: steps.cache.outputs.cache-hit == 'true'
        run: tar -C /opt -cJf /tmp/cegcc.tar.xz cegcc && ls -la /tmp/cegcc.tar.xz
      - uses: actions/upload-artifact@v4
        if: steps.cache.outputs.cache-hit == 'true'
        with:
          name: cegcc
          path: /tmp/cegcc.tar.xz
          retention-days: 1
