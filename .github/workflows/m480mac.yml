name: M480Mac (WM6.1)

on:
  push:
    paths:
      - 'M480Mac/**'
      - '.github/workflows/m480mac.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: M480Mac
    steps:
      - uses: actions/checkout@v4

      - name: Cache cegcc toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /opt/cegcc
          key: cegcc-arm-mingw32ce-v1

      - name: Build cegcc toolchain (first run only, ~40-60 min)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev
          git clone --depth 1 https://github.com/MaxKellermann/cegcc-build /tmp/cegcc-build
          cd /tmp/cegcc-build
          git submodule update --init --depth 1
          sed -i 's/^\t--disable-werror$/\t--disable-werror --disable-gdb --disable-gdbserver --disable-sim --disable-gprofng/' build.sh
          mkdir -p /tmp/cegcc-out && cd /tmp/cegcc-out
          sudo mkdir -p /opt/cegcc && sudo chown $USER /opt/cegcc
          /tmp/cegcc-build/build.sh --prefix=/opt/cegcc -j 4

      - name: Build emulator + CAB
        run: |
          sudo apt-get install -y gcab
          export PATH=/opt/cegcc/bin:$PATH
          make -j4
          /opt/cegcc/bin/arm-mingw32ce-objdump -p build/M480Mac.exe | grep "DLL Name" || true
          mkdir -p out sym && cp build/M480Mac.exe README.txt _setup.xml out/ && cp build/M480Mac-sym.exe sym/
          cd out && gcab -c -z M480Mac.cab _setup.xml M480Mac.exe README.txt && rm _setup.xml

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: M480Mac
          path: M480Mac/out/*

      - name: Upload symbols (for profiling)
        uses: actions/upload-artifact@v4
        with:
          name: M480Mac-sym
          path: M480Mac/sym/*
