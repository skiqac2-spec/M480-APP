name: M480Nico (WM6.1)

on:
  push:
    paths:
      - 'M480Nico/**'
      - '.github/workflows/m480nico.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: M480Nico
    steps:
      - uses: actions/checkout@v4

      - name: Cache cegcc toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /opt/cegcc
          key: cegcc-arm-mingw32ce-v1

      - name: Build cegcc toolchain (first run only, ~40-60 min)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev
          git clone --depth 1 https://github.com/MaxKellermann/cegcc-build /tmp/cegcc-build
          cd /tmp/cegcc-build
          git submodule update --init --depth 1
          sed -i 's/^\t--disable-werror$/\t--disable-werror --disable-gdb --disable-gdbserver --disable-sim --disable-gprofng/' build.sh
          mkdir -p /tmp/cegcc-out && cd /tmp/cegcc-out
          sudo mkdir -p /opt/cegcc && sudo chown $USER /opt/cegcc
          /tmp/cegcc-build/build.sh --prefix=/opt/cegcc -j 4

      - name: Cache FFmpeg (WinCE)
        id: ffcache
        uses: actions/cache@v4
        with:
          path: M480Nico/ffmpeg-ce
          key: ffmpeg-ce-${{ hashFiles('M480Nico/build_ffmpeg.sh') }}

      - name: Build FFmpeg (WinCE)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          export PATH=/opt/cegcc/bin:$PATH
          ./build_ffmpeg.sh ce

      - name: Build M480Nico + CAB
        run: |
          sudo apt-get install -y gcab
          export PATH=/opt/cegcc/bin:$PATH
          make ce
          mkdir -p out
          cp build/M480Nico.exe README.txt _setup.xml out/
          cd out && gcab -c -z M480Nico.cab _setup.xml M480Nico.exe README.txt && rm _setup.xml
          ls -la

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: M480Nico
          path: M480Nico/out/*

      - name: Put the build into downloads/ (phone download list)
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p downloads/M480Nico
          cp M480Nico/out/M480Nico.cab M480Nico/out/M480Nico.exe M480Nico/out/README.txt downloads/M480Nico/
          python3 tools/update_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add downloads/M480Nico downloads/files.txt
          git commit -m "downloads: M480Nico build" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
